<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --neon-blue: #339af0;
            --neon-red: #ff5f5f;
            --text-main: #e6edf3;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 1. NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--neon-blue);
            height: var(--nav-height);
            position: relative;
            z-index: 1001;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-pedestal {
            width: 42px;
            height: 42px;
            border: 1px solid var(--neon-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
        }

        .nav-logo { height: 24px; width: auto; filter: invert(1); }
        .brand-name { font-weight: bold; color: var(--neon-blue); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .nav-links a {
            pointer-events: auto;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .nav-links a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        /* Ensure the wrapper centers the form/content correctly */
.main-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center; 
    padding: 40px 20px;
    gap: 40px;
}

/* Force Search Box to stay dark and formatted */
.search-box {
    display: flex;
    align-items: center;
    background: #0d1117 !important;
    border: 1px solid var(--neon-blue);
    border-radius: 20px;
    padding: 0 12px;
    height: 36px;
    width: 220px;
}

.search-box input {
    background: transparent !important;
    border: none !important;
    color: white;
    outline: none;
}
/* 1. Desktop State: Hide Hamburger */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    margin-left: 15px; /* Space it from the search bar if needed */
}

.hamburger span {
    width: 25px;
    height: 3px;
    background: var(--neon-blue);
    border-radius: 2px;
}

/* 2. Tablet/Mobile State (Below 1024px) */
@media (max-width: 1023px) {
    /* Hide the Nav Links and the Search Box */
    .nav-links, 
    .nav-right .search-box {
        display: none !important;
    }

    /* Show the Hamburger icon where the search bar was */
    .hamburger {
        display: flex !important;
    }
    
    /* Ensure nav-right stays visible to hold the hamburger */
    .nav-right {
        display: flex;
        align-items: center;
    }
}

/* RESPONSIVE LOGIC: Disappearing Links & Search Bar */
@media (max-width: 1023px) {
    /* Hide specific navbar elements */
    .nav-links, .nav-right {
        display: none !important;
    }

    /* Show the menu icon instead */
    .hamburger {
        display: flex !important;
    }

    /* Adjust cards for tablet/mobile */
    .stats-grid {
        grid-template-columns: repeat(2, 1fr) !important;
    }
}

@media (max-width: 600px) {
    .stats-grid {
        grid-template-columns: 1fr !important;
    }
}

        .stats-grid {
            display: grid;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1.5px solid var(--neon-red);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        /* 3. FORM STYLING */
        .form-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-container h2 { margin-bottom: 20px; color: var(--neon-blue); text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #8b949e; }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--neon-blue);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .footer-links { margin-top: 20px; text-align: center; font-size: 0.85rem; }
        .footer-links a { color: var(--neon-blue); text-decoration: none; }

        @media (max-width: 767px) { .stats-grid { grid-template-columns: 1fr; } }
        @media (min-width: 768px) and (max-width: 1023px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-container">
        <div class="logo-pedestal">
            <img src="https://cdn-icons-png.flaticon.com/512/9431/9431215.png" alt="Icon" class="nav-logo">
        </div>
        <span class="brand-name">Davies' app</span>
    </div>

    <ul class="nav-links">
        <li><a href="login.html">Login</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
    </ul>

    <div class="nav-right">
        <div class="search-box">
            <input type="text" placeholder="Search...">
            <button class="search-btn">🔍</button>
        </div>
    </div>
    <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
</nav>

<div class="main-wrapper">
    <div class="stats-grid">
        <div class="stat-card"><h4>Items</h4><span>1</span></div>
        <div class="stat-card"><h4>Items</h4><span>2</span></div>
        <div class="stat-card"><h4>Items</h4><span>3</span></div>
        <div class="stat-card"><h4>Items</h4><span>4</span></div>
    </div>

    <div class="form-container">
        <h2>Create Account</h2>
        <form action="/register" method="POST">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="Eg. Davies" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="last name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="@" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="*************" required>
            </div>
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>

        <div class="footer-links">
            <span>Already have an account? <a href="login.html">Login</a></span>
        </div>
    </div>
</div>

</body>
</html>
