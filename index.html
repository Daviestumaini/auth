<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration</title>
    <style>
    /* --- SHARED LAYOUT & NAVBAR --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }
    .navbar {
        display: flex; justify-content: space-between; align-items: center;
        background-color: #1a1a1a; color: white; padding: 0 25px; height: 70px; flex-shrink: 0;
    }
    .nav-left, .nav-center, .nav-right { flex: 1; display: flex; align-items: center; }
    .nav-center { justify-content: center; }
    .nav-right { justify-content: flex-end; }
    .nav-logo { height: 45px; margin-right: 10px; border-radius: 4px; }

    /* SEARCH BAR (Shrunk button fix) */
    .search-wrapper {
        display: flex; align-items: center; background: #333;
        border: 1px solid #4a90e2; border-radius: 20px; padding: 5px 10px; min-width: 180px;
    }
    .search-wrapper input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 14px; }
    .search-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding-left: 5px; opacity: 0.8; }

    /* MAIN CENTERING WRAPPER */
    .main-wrapper {
        display: flex; flex-direction: column; justify-content: center;
        align-items: center; flex-grow: 1; gap: 15px; padding: 15px;
    }

    /* BLUE ITEMS (1, 2, 3, 4) */
    .flex-container { display: flex; gap: 10px; }
    .flex-container div {
        width: 35px; height: 35px; background-color: #2575fc; color: white;
        display: flex; justify-content: center; align-items: center;
        font-weight: bold; border-radius: 5px;
    }

    /* --- REGISTRATION SPECIFIC --- */
    .registration-container {
        background: white; padding: 25px 35px; border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px;
    }
    h2 { text-align: center; margin-bottom: 15px; color: #333; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; color: #555; font-size: 13px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    
    button[type="submit"] {
        width: 100%; padding: 12px; background-color: #28a745; /* Green */
        color: white; border: none; border-radius: 6px; font-weight: bold;
        cursor: pointer; margin-top: 8px;
    }
    .footer-links { text-align: center; margin-top: 12px; font-size: 13px; }
    .footer-links a { color: #2575fc; text-decoration: none; font-weight: 600; }
</style>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
   <nav class="navbar">
  <div class="nav-left">
    <div class="logo-container">
      <img src="logo/gloryday.jpg" alt="App Logo" class="nav-logo">
      <span class="brand-name">Davies' app</span>
    </div>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a href="login.html">Login</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-wrapper">
      <input type="text" placeholder="Search..." aria-label="Search">
      <button class="search-btn">🔍</button>
    </div>
  </div>
</nav>

    <div class="flex-container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>
<div class="main-wrapper">
    <div class="registration-container"></div>
        <h2>Create Account</h2>
        <form action="/register" method="POST">
            
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" placeholder="Eg. Davies" required>
            </div>
            <div class="form-group">
                <label for="lastname">Last name</label>
                <input type="text" id="lastname" placeholder="last name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="@" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="*************" required>
            </div>
        
            <button type="submit">Sign Up</button>
        </form>

        <div class="footer-links">
            <span>Already have an account? <a href="login.html">Login</a></span>
            <span class="divider">|</span>
            <a href="dashboard.html">View Dashboard</a>
        </div>
    </div>
</body>
</html>
