<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/AUTH/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration</title>
    <style>
     :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --neon-blue: #339af0;
            --neon-red: #ff5f5f;
            --neon-green: #51cf66;
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 2. NAVBAR (With Row Fix & High Visibility Logo) */
        .navbar {
            display: flex;
            justify-content: space-between !important;
            align-items: center;
            padding: 10px 20px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--neon-blue);
            min-height: 70px;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }

        .logo-pedestal {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: space-around;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(51, 154, 240, 0.3);
        }

        .nav-logo {
            height: 30px;
            filter: invert(1) drop-shadow(0 0 8px var(--neon-blue));
        }

        .brand-text { display: flex; flex-direction: column; line-height: 1.1; justify-content: space-around; }
        .brand-main { color: var(--neon-blue); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; }
        .brand-sub { color: #fff; font-size: 0.75rem; opacity: 0.7; }

 .nav-links {
            flex: 2;
            display: flex !important;
            list-style: none !important;
            gap: 25px;
            justify-content: center !important;
            align-items: center !important;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    /* SEARCH BAR (Shrunk button fix) */
    .search-wrapper {
        display: flex; align-items: center; background: #333;
        border: 1px solid #4a90e2; border-radius: 20px; padding: 5px 10px; min-width: 180px;
    }
    .search-wrapper input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 14px; }
    .search-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding-left: 5px; opacity: 0.8; }

    /* MAIN CENTERING WRAPPER */
    .main-wrapper {
        display: flex; flex-direction: column; justify-content: center;
        align-items: center; flex-grow: 1; gap: 15px; padding: 15px;
    }

    /* BLUE ITEMS (1, 2, 3, 4) */
    .flex-container { display: flex; gap: 10px; justify-content: center; align-items: center; }
    .flex-container div {
        width: 35px; height: 35px; background-color: #2575fc; color: white;
        display: flex; justify-content: center; align-items: center;
        font-weight: bold; border-radius: 5px;
    }

    /* --- REGISTRATION SPECIFIC --- */
    .registration-container {
        background: white; padding: 25px 35px; border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; height: auto;
    }
    h2 { text-align: center; margin-bottom: 15px; color: #333; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; color: #555; font-size: 13px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    
    button[type="submit"] {
        width: 100%; padding: 12px; background-color: #28a745; /* Green */
        color: white; border: none; border-radius: 6px; font-weight: bold;
        cursor: pointer; margin-top: 8px;
    }
    .footer-links { text-align: center; margin-top: 12px; font-size: 13px; }
    .footer-links a { color: #2575fc; text-decoration: none; font-weight: 600; }
    @media screen and (min-width: 1025px) {
    .sidebar {
        width: 260px; /* Wider sidebar for big screens */
    }

    .stats-grid {
        grid-template-columns: repeat(4, 1fr); /* All four cards in one row */
        flex-direction: row;
    }

    .main-content {
        padding: 40px; /* More breathing room on large screens */
    }
}
/* Tablet Layout Logic */
@media (min-width: 768px) {
  .main-content {
    display: flex;
    flex-direction: column;
    gap: 25px;
    padding: 25px;
    background-color: #121212; /* Dark background like wireframe */
  }

  /* 2x2 Grid for Top Cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .stat-card {
    height: 100px;
    background: #1e1e1e;
    border: 1px solid #ff4d4d; /* Red border from wireframe */
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
  }

  /* Detailed Table Panel (Green Section) */
  .detailed-panel {
    flex-direction: column;
    border: 2px solid #4ade80; /* Green border */
    box-sizing: border-box;
    padding: 10px;
    background: #1a1a1a;
    height: auto;
    min-height: min-content;
    width: 100%;
  }

  .panel-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  .tab, .panel-footer-bar {
    border: 1px solid #3b82f6; /* Blue border from wireframe */
    padding: 8px 15px;
    box-sizing: border-box;
    background: transparent;
    color: #3b82f6;
  }
  .user-data-table {
  width: 100%;
  border-collapse: collapse;
  background-color: transparent; /* Makes the table match the black box */
  color: white; /* Makes text readable on dark background */
}

/* Update your table rows to be legible */
.user-data-table tr {
  border-bottom: 1px solid #333;
}

  /* Bottom Panel (Green Section) */
  /* This targets specifically the elements inside that panel */
.summary-panel h3 {
  margin-top: 0;
  margin-bottom: 5px; /* Small gap between title and text */
  font-size: 1.1rem;   /* Optional: shrink the title slightly */
}

.summary-panel p {
  margin-bottom: 0;   /* Removes the extra space at the bottom */
}
}

/* Scrollable table fix for smaller tablets */
.scrollable-table {
  overflow-x: auto;
  margin-top: 10px;
  background: transparent;
}/* The container for Sidebar + Content */
.main-body {
  display: flex !important;
  justify-content: center;
  flex-direction: row !important;
  flex-grow: 1 !important; /* Takes up all remaining vertical space */
  overflow: hidden;
  height: calc(100vh - 60px);
  width: 100%;
  padding: 20px;
}
/* The Left Sidebar */
.sidebar {
  width: 250px !important;
  height: 90vh;
  background: #343a40;
  display: flex;
  flex-direction: column;
  padding: 20px;
  flex-shrink: 0 !important;
  gap: 10px;
  min-height: 100%;
}
@media screen and (max-width: 300px) {
    .sidebar {
        width: 100%; 
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;    
    }
}
</style>
</head>
<body>
   <nav class="navbar">
  <div class="nav-left">
    <div class="logo-pedestal">
      <img src="https://cdn-icons-png.flaticon.com/512/9431/9431215.png" 
                 alt="Tech Icon" 
                 class="nav-logo">
      <span class="brand-name">Davies' app</span>
    </div>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a href="login.html">Login</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-wrapper">
      <input type="text" placeholder="Search..." aria-label="Search">
      <button class="search-btn">🔍</button>
    </div>
  </div>
</nav>

    <div class="flex-container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>
<div class="main-wrapper">
    <div class="registration-container"></div>
        <h2>Create Account</h2>
        <form action="/register" method="POST">
            
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" placeholder="Eg. Davies" required>
            </div>
            <div class="form-group">
                <label for="lastname">Last name</label>
                <input type="text" id="lastname" placeholder="last name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="@" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="*************" required>
            </div>
        
            <button type="submit">Sign Up</button>
        </form>

        <div class="footer-links">
            <span>Already have an account? <a href="login.html">Login</a></span>
            <span class="divider">|</span>
            <a href="dashboard.html">View Dashboard</a>
        </div>
    </div>
</body>
</html>
