<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/AUTH/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration</title>
    <style>
     :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --neon-blue: #339af0;
            --neon-red: #ff5f5f;
            --neon-green: #51cf66;
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 2. NAVBAR (With Row Fix & High Visibility Logo) */
        .navbar {
            display: flex;
            justify-content: space-between !important;
            align-items: center;
            padding: 10px 20px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--neon-blue);
            min-height: 70px;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }

        .logo-pedestal {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: space-around;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(51, 154, 240, 0.3);
        }

        .nav-logo {
            height: 30px;
            filter: invert(1) drop-shadow(0 0 8px var(--neon-blue));
        }

        .brand-text { display: flex; flex-direction: column; line-height: 1.1; justify-content: space-around; }
        .brand-main { color: var(--neon-blue); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; }
        .brand-sub { color: #fff; font-size: 0.75rem; opacity: 0.7; }

 .nav-links {
            flex: 2;
            display: flex !important;
            list-style: none !important;
            gap: 25px;
            justify-content: center !important;
            align-items: center !important;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    /* SEARCH BAR (Shrunk button fix) */
    .search-wrapper {
        display: flex; align-items: center; background: #333;
        border: 1px solid #4a90e2; border-radius: 20px; padding: 5px 10px; min-width: 180px;
    }
    .search-wrapper input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 14px; }
    .search-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding-left: 5px; opacity: 0.8; }

    /* MAIN CENTERING WRAPPER */
    .main-wrapper {
        display: flex; flex-direction: column; justify-content: center;
        align-items: center; flex-grow: 1; gap: 15px; padding: 15px;
    }

    /* BLUE ITEMS (1, 2, 3, 4) */
    .flex-container { display: flex; gap: 10px; justify-content: center; align-items: center; }
    .flex-container div {
        width: 35px; height: 35px; background-color: #2575fc; color: white;
        display: flex; justify-content: center; align-items: center;
        font-weight: bold; border-radius: 5px;
    }

    /* --- REGISTRATION SPECIFIC --- */
    .registration-container {
        background: white; padding: 25px 35px; border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; height: auto;
    }
    h2 { text-align: center; margin-bottom: 15px; color: #333; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; color: #555; font-size: 13px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    
    button[type="submit"] {
        width: 100%; padding: 12px; background-color: #28a745; /* Green */
        color: white; border: none; border-radius: 6px; font-weight: bold;
        cursor: pointer; margin-top: 8px;
    }
    .footer-links { text-align: center; margin-top: 12px; font-size: 13px; }
    .footer-links a { color: #2575fc; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
   <nav class="navbar">
  <div class="nav-left">
    <div class="logo-pedestal">
      <img src="https://cdn-icons-png.flaticon.com/512/9431/9431215.png" 
                 alt="Tech Icon" 
                 class="nav-logo">
      <span class="brand-name">Davies' app</span>
    </div>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a href="login.html">Login</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-wrapper">
      <input type="text" placeholder="Search..." aria-label="Search">
      <button class="search-btn">🔍</button>
    </div>
  </div>
</nav>

    <div class="flex-container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>
<div class="main-wrapper">
    <div class="registration-container"></div>
        <h2>Create Account</h2>
        <form action="/register" method="POST">
            
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" placeholder="Eg. Davies" required>
            </div>
            <div class="form-group">
                <label for="lastname">Last name</label>
                <input type="text" id="lastname" placeholder="last name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="@" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="*************" required>
            </div>
        
            <button type="submit">Sign Up</button>
        </form>

        <div class="footer-links">
            <span>Already have an account? <a href="login.html">Login</a></span>
            <span class="divider">|</span>
            <a href="dashboard.html">View Dashboard</a>
        </div>
    </div>
</body>
</html>
