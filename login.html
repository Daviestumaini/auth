<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
   <style>
    /* 1. Base Setup & Root Variables */
    :root {
        --bg-dark: #0d1117;
        --card-bg: #161b22;
        --neon-blue: #339af0;
        --text-main: #e6edf3;
        --nav-height: 70px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow-x: hidden;
    }

    /* 2. NAVBAR REFACTORED */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 30px;
        background: var(--card-bg);
        border-bottom: 2px solid var(--neon-blue);
        height: var(--nav-height);
        position: relative; /* REQUIRED for absolute centering of links */
        z-index: 1001;
    }

    .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10;
    }

    /* CENTERED NAV LINKS */
    .nav-links {
        display: flex;
        list-style: none;
        gap: 40px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%); /* The secret sauce for perfect centering */
    }

    .nav-links a {
        text-decoration: none;
        color: var(--text-main);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 1px;
        transition: 0.3s;
    }

    .nav-links a:hover {
        color: var(--neon-blue);
        text-shadow: 0 0 8px var(--neon-blue);
    }
   .search-box {
    display: flex;          /* 1. Use flex to put them side-by-side */
    align-items: center;    /* 2. Vertically center the text and icon */
    width: 250px;           /* 3. Give the box a set width */
    background: #161b22;
    border: 1.5px solid #339af0;
    border-radius: 20px;
    padding: 0 15px;
}

.search-box input {
    flex: 1;                /* 4. THIS IS THE KEY: It forces the input to fill all empty space */
    background: transparent;
    border: none;
    min-width: 150px;           /* 5. Prevent it from shrinking too much */
    outline: none;
    color: white;
    height: 40px;
}


.search-box button {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0;
    font-size: 1.1rem;      /* Size of the emoji 🔍 */
}

    /* HAMBURGER - Hidden on Desktop */
    .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        background: none;
        border: none;
        z-index: 1100;
    }

    .hamburger span {
        width: 25px;
        height: 3px;
        background: var(--neon-blue);
        border-radius: 2px;
    }

    /* 3. MAIN CONTENT AREA */
    .main-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-grow: 1;
        padding: 40px 20px;
        overflow-y: auto;
        gap: 40px;
    }

    /* The Blue Items (1, 2, 3, 4) */
    /* 1. THE CARDS CONTAINER */
.stats-grid {
    display: grid;
    gap: 20px;
    width: 100%;
    max-width: 1100px; /* Keeps them from spreading too far on huge monitors */
    margin: 0 auto 30px auto; /* Centers the grid itself */
    padding: 20px;
}

/* 2. THE CARD STYLE */
.stat-card {
    background: var(--card-bg);
    border: 1.5px solid var(--neon-red); /* Using your neon red theme */
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-5px);
    border-color: var(--neon-blue);
}

/* 3. RESPONSIVE GRID LOGIC */

/* MOBILE VIEW (Default) */
@media (max-width: 767px) {
    .stats-grid {
        grid-template-columns: 1fr; /* 1 column stack */
    }
}

/* TABLET VIEW (768px to 1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
    .stats-grid {
        grid-template-columns: repeat(2, 1fr); /* 2x2 Grid */
    }
}

/* DESKTOP VIEW (1024px and up) */
@media (min-width: 1024px) {
    .stats-grid {
        grid-template-columns: repeat(4, 1fr); /* 1 row of 4 */
    }
    
    /* Re-enabling the link and search logic from before */
    .nav-links { display: flex !important; }
    .hamburger { display: none !important; }
}

    /* LOGIN CONTAINER - Improved visibility from your screenshot */
   .login-container {
    width: 100%;
    max-width: 400px;      /* Keeps the form from getting too wide */
    background: #161b22;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid #30363d;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    
    /* Optional: extra insurance for centering */
    margin: 0 auto; 
}

    .login-container h2 { margin-bottom: 20px; color: var(--neon-blue); }

    .form-group { margin-bottom: 15px; }

    input {
        width: 100%;
        padding: 12px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: white;
        margin-top: 5px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: var(--neon-blue);
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }
/* 1. DESKTOP LINKS (Centered) */
.nav-links {
    display: flex;
    list-style: none;
    gap: 30px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none; /* Let clicks pass through to the search bar */
    z-index: 10;
}

.nav-links a {
    pointer-events: auto; /* Make the actual text clickable */
    text-decoration: none;
    color: var(--text-main);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.85rem;
}

/* 2. THE HAMBURGER (Menu Icon) */
/* 1. Base Hamburger Style (Hidden by default) */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
}

.hamburger span {
    width: 25px;
    height: 3px;
    background: var(--neon-blue);
    border-radius: 2px;
}

/* 2. Responsive Swap (Below 1024px) */
@media (max-width: 1023px) {
    /* Hide the center links and the search bar */
    .nav-links, 
    .nav-right .search-box {
        display: none !important;
    }

    /* Reveal the Hamburger icon in the nav-right slot */
    .hamburger {
        display: flex !important;
    }

    /* Keep the nav-right container active to align the hamburger */
    .nav-right {
        display: flex;
        align-items: center;
    }
}

/* 3. RESPONSIVE LOGIC (The "Disappearing" Act) */

/* If the screen is SMALLER than 1024px (Tablet/Mobile) */
@media (max-width: 1023px) {
    .nav-links {
        display: none !important; /* LINKS DISAPPEAR */
    }

    .hamburger {
        display: flex; /* MENU ICON APPEARS */
    }
    
    .search-box {
        width: 180px; /* Shrink search box slightly for smaller screens */
    }
}

/* If the screen is LARGER than 1024px (Desktop) */
@media (min-width: 1024px) {
    .nav-links {
        display: flex; /* LINKS SHOW UP */
    }

    .hamburger {
        display: none; /* MENU ICON HIDDEN */
    }
}
    /* 4. RESPONSIVE MEDIA QUERIES */

    /* TABLET & MOBILE VIEW (Below 1024px) */
    @media (max-width: 1023px) {
        .nav-links {
            display: none; /* Disappear centered links */
        }

        .hamburger {
            display: flex; /* Show menu icon */
        }

        .navbar {
            padding: 0 20px;
        }
    }

    /* DESKTOP VIEW (1024px and up) */
    @media (min-width: 1024px) {
        .hamburger {
            display: none; /* Ensure icon is hidden on desktop */
        }
        
        .nav-links {
            display: flex; /* Ensure links are visible */
        }
    }
</style>
</head>
<body>
   <nav class="navbar">
  <div class="nav-left">
    <div class="logo-pedestal">
      <img src="https://cdn-icons-png.flaticon.com/512/9431/9431215.png" 
                 alt="Tech Icon" 
                 class="nav-logo">
        </div>  
    <span>Davies' app</span>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a href="index.html">Register</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-box">
      <input type="text" placeholder="Search...">
      <button style="background:none; border:none; cursor:pointer;">🔍</button>
    </div>
  </div>
  <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
</nav>
<div class="stats-grid">
    <div class="stat-card">
        <h4>Items</h4>
        <span>1</span>

    <div class="stat-card">

    <div class="stat-card">

</div>
    <div class="login-container">
        <h2>Login</h2>        
        <form action="/login" method="POST">
            <div class="form-group">

        </form>
    
        <div class="footer-links">
            <div>New here? <a href="index.html">Create an Account</a></div>
            <div style="margin-top: 10px;">
                <a href="dashboard.html">Go to Dashboard</a>
            </div>
        </div>
    </div></div>
</body>
</html>
