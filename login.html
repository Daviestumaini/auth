<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
   <style>
    /* 1. Reset everything so there are no hidden gaps */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* 2. Make the body the full height of your screen */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow-x: hidden;
    }

    /* 3. The Navbar (Stays at the very top) */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1a1a1a;
        color: white;
        padding: 0 20px;
        height: 70px;
        flex-shrink: 0;
    }

    /* 4. The MAIN WRAPPER (The Fix) */
    .main-wrapper {
        display: flex;
        flex-direction: column; /* Forces items to stack TOP to BOTTOM */
        justify-content: center; /* Centers the whole stack vertically */
        align-items: center;     /* Centers everything horizontally */
        flex-grow: 1;            /* Fills all space between nav and bottom */
        gap: 30px;               /* The gap between the blue boxes and the form */
        padding: 20px;
    }

    /* 5. The Blue Items Container */
    .flex-container {
        display: flex;
        gap: 15px;
    }

    .flex-container div {
        width: 40px;
        height: 40px;
        background-color: #2575fc;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        border-radius: 4px;
    }

    /* 6. The Login Container */
    .login-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }

    /* Form styling for a clean look */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
    input { 
        width: 100%; 
        padding: 10px; 
        border: 1px solid #ddd; 
        border-radius: 5px; 
    }
    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
</style>
</head>
<body>
   <nav class="navbar">
  <div class="nav-left">
    <img src="logo/gloryday.jpg" class="nav-logo">
    <span>Davies' app</span>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a href="index.html">Register</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-box">
      <input type="text" placeholder="Search...">
      <button style="background:none; border:none; cursor:pointer;">🔍</button>
    </div>
  </div>
</nav>
<div class="main-wrapper">
    <div class="flex-container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>

    <div class="login-container">
        <h2>Login</h2>        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
    
        <div class="footer-links">
            <div>New here? <a href="index.html">Create an Account</a></div>
            <div style="margin-top: 10px;">
                <a href="dashboard.html">Go to Dashboard</a>
            </div>
        </div>
    </div></div>
</body>
</html>
