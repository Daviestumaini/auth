<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
   <style>
    /* 1. Base Setup */
    :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --neon-blue: #339af0;
            --neon-red: #ff5f5f;
            --neon-green: #51cf66;
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 2. NAVBAR (With Row Fix & High Visibility Logo) */
        .navbar {
            display: flex;
            justify-content: space-between !important;
            align-items: center;
            padding: 10px 20px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--neon-blue);
            min-height: 70px;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }

        .logo-pedestal {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(51, 154, 240, 0.3);
        }

        .nav-logo {
            height: 30px;
            filter: invert(1) drop-shadow(0 0 8px var(--neon-blue));
        }

        .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
        .brand-main { color: var(--neon-blue); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; }
        .brand-sub { color: #fff; font-size: 0.75rem; opacity: 0.7; }


    .nav-links {
            flex: 2;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            list-style: none !important;
            gap: 25px;
        }

    .nav-links a {
        text-decoration: none;
        color: #444;
        font-weight: 500;
        font-size: 15px;
    }

    /* Search Box (Dark & Rounded) */
    .search-box {
        display: flex;
        align-items: center;
        background: #333;
        border-radius: 25px;
        padding: 6px 15px;
        width: 220px;
    }

    .search-box input {
        background: transparent;
        border: none;
        color: white;
        outline: none;
        width: 100%;
        font-size: 14px;
    }

    /* 3. The Vertical Stacker */
    .main-wrapper {
        display: flex;
        flex-direction: column; /* Forces vertical stacking */
        justify-content: center;
        align-items: center;
        flex-grow: 1;
        gap: 25px; /* Gap between items and the login box */
        padding: 20px;
    }

    /* 4. Blue Items (1, 2, 3, 4) */
    .flex-container {
        display: flex;
        gap: 12px;
    }

    .item {
        width: 40px;
        height: 40px;
        background-color: #2575fc;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        border-radius: 6px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* 5. Login Box */
    .login-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 400px;
    }

    h2 {
        font-size: 1.8rem;
        margin-bottom: 25px;
        color: #222;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #444;
        font-size: 14px;
    }

    input[type="email"], 
    input[type="password"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
    }

    /* Button Styling */
    button[type="submit"] {
        width: 100%;
        padding: 14px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    button[type="submit"]:hover {
        background-color: #0056b3;
    }

    .footer-links {
        margin-top: 25px;
        text-align: center;
        font-size: 14px;
        color: #666;
    }

    .footer-links a {
        color: #007bff;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>
   <nav class="navbar">
  <div class="nav-left">
    <div class="logo-pedestal">
      <img src="https://cdn-icons-png.flaticon.com/512/9431/9431215.png" 
                 alt="Tech Icon" 
                 class="nav-logo">
        </div>  
    <span>Davies' app</span>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a href="index.html">Register</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-box">
      <input type="text" placeholder="Search...">
      <button style="background:none; border:none; cursor:pointer;">🔍</button>
    </div>
  </div>
</nav>
<div class="main-wrapper">
    <div class="flex-container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>

    <div class="login-container">
        <h2>Login</h2>        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
    
        <div class="footer-links">
            <div>New here? <a href="index.html">Create an Account</a></div>
            <div style="margin-top: 10px;">
                <a href="dashboard.html">Go to Dashboard</a>
            </div>
        </div>
    </div></div>
</body>
</html>
