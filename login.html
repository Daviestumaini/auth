<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
   <style>
    /* 1. Base Setup */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    /* 2. Navbar Styling (3-Zone Layout) */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #ffffff;
        border-bottom: 1px solid #ddd;
        padding: 0 30px;
        height: 70px;
        flex-shrink: 0;
    }

    .nav-left, .nav-center, .nav-right {
        flex: 1;
        display: flex;
        align-items: center;
    }

    .nav-center { justify-content: center; }
    .nav-right { justify-content: flex-end; }

    .nav-logo {
        height: 45px;
        margin-right: 10px;
        border-radius: 4px;
    }

    .nav-links {
        display: flex;
        list-style: none;
        gap: 25px;
    }

    .nav-links a {
        text-decoration: none;
        color: #444;
        font-weight: 500;
        font-size: 15px;
    }

    /* Search Box (Dark & Rounded) */
    .search-box {
        display: flex;
        align-items: center;
        background: #333;
        border-radius: 25px;
        padding: 6px 15px;
        width: 220px;
    }

    .search-box input {
        background: transparent;
        border: none;
        color: white;
        outline: none;
        width: 100%;
        font-size: 14px;
    }

    /* 3. The Vertical Stacker */
    .main-wrapper {
        display: flex;
        flex-direction: column; /* Forces vertical stacking */
        justify-content: center;
        align-items: center;
        flex-grow: 1;
        gap: 25px; /* Gap between items and the login box */
        padding: 20px;
    }

    /* 4. Blue Items (1, 2, 3, 4) */
    .flex-container {
        display: flex;
        gap: 12px;
    }

    .item {
        width: 40px;
        height: 40px;
        background-color: #2575fc;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        border-radius: 6px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* 5. Login Box */
    .login-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 400px;
    }

    h2 {
        font-size: 1.8rem;
        margin-bottom: 25px;
        color: #222;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #444;
        font-size: 14px;
    }

    input[type="email"], 
    input[type="password"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
    }

    /* Button Styling */
    button[type="submit"] {
        width: 100%;
        padding: 14px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    button[type="submit"]:hover {
        background-color: #0056b3;
    }

    .footer-links {
        margin-top: 25px;
        text-align: center;
        font-size: 14px;
        color: #666;
    }

    .footer-links a {
        color: #007bff;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>
   <nav class="navbar">
  <div class="nav-left">
    <img src="logo/gloryday.jpg" class="nav-logo">
    <span>Davies' app</span>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a href="index.html">Register</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-box">
      <input type="text" placeholder="Search...">
      <button style="background:none; border:none; cursor:pointer;">🔍</button>
    </div>
  </div>
</nav>
<div class="main-wrapper">
    <div class="flex-container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>

    <div class="login-container">
        <h2>Login</h2>        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
    
        <div class="footer-links">
            <div>New here? <a href="index.html">Create an Account</a></div>
            <div style="margin-top: 10px;">
                <a href="dashboard.html">Go to Dashboard</a>
            </div>
        </div>
    </div></div>
</body>
</html>
